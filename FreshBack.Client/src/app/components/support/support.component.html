<div class="support-page">
  <div class="content-body">
    <h1 class="page-title">الدعم والمساعدة</h1>

    <!-- Contact Us Section -->
    <section class="contact-section">
      <h2 class="section-title">تواصل معنا</h2>
      <div class="contact-cards">
        <div *ngFor="let contact of contactInfo" class="contact-card">
          <div class="contact-icon" [ngClass]="'icon-' + contact.type">
            <svg *ngIf="contact.type === 'hours'" width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
              <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <svg *ngIf="contact.type === 'phone'" width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 5C3 3.89543 3.89543 3 5 3H8.27924C8.70967 3 9.09181 3.27543 9.22792 3.68377L10.7257 8.17721C10.8831 8.64932 10.6694 9.16531 10.2243 9.38787L7.96701 10.5165C9.06925 12.9612 11.0388 14.9308 13.4835 16.033L14.6121 13.7757C14.8347 13.3306 15.3507 13.1169 15.8228 13.2743L20.3162 14.7721C20.7246 14.9082 21 15.2903 21 15.7208V19C21 20.1046 20.1046 21 19 21H18C9.71573 21 3 14.2843 3 6V5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg *ngIf="contact.type === 'email'" width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 4H20C21.1 4 22 4.9 22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6C2 4.9 2.9 4 4 4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M22 6L12 13L2 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="contact-value">{{ contact.value }}</div>
        </div>
      </div>
    </section>

    <!-- FAQ Section -->
    <section class="faq-section">
      <h2 class="section-title">الأسئلة الشائعة</h2>
      <div class="faq-list">
        <div *ngFor="let item of faqItems" class="faq-item" [class.expanded]="item.isExpanded">
          <div class="faq-header" (click)="toggleFAQ(item)">
            <h3 class="faq-question">{{ item.question }}</h3>
            <div class="faq-arrow">
              <svg 
                *ngIf="item.isExpanded" 
                width="20" 
                height="20" 
                viewBox="0 0 24 24" 
                fill="none" 
                xmlns="http://www.w3.org/2000/svg"
              >
                <path d="M18 15L12 9L6 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg 
                *ngIf="!item.isExpanded" 
                width="20" 
                height="20" 
                viewBox="0 0 24 24" 
                fill="none" 
                xmlns="http://www.w3.org/2000/svg"
              >
                <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <div class="faq-answer" *ngIf="item.isExpanded">
            <p>{{ item.answer }}</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Educational Videos Section -->
    <section class="videos-section">
      <h2 class="section-title">الفيديوهات التعليمية</h2>
      <div class="videos-grid">
        <div *ngFor="let video of videos" class="video-card">
          <div class="video-thumbnail">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 10L18.553 7.724C19.528 7.063 20.5 7.697 20.5 8.896V15.104C20.5 16.303 19.528 16.937 18.553 16.276L15 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="3" y="5" width="12" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span class="video-duration">{{ video.duration }}</span>
          </div>
          <h4 class="video-title">{{ video.title }}</h4>
        </div>
      </div>
    </section>
  </div>
</div>
