<div class="panel-overlay" (click)="onOverlayClick($event)">
  <div class="panel-content" (click)="$event.stopPropagation()">
    <div class="panel-header">
      <h2 class="panel-title">{{ t.title }}</h2>
      <button class="close-btn" (click)="onClose()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <div class="panel-body">
      <form (ngSubmit)="onSubmit()">

        <!-- ── Images ──────────────────────────────────────────────────────── -->
        <div class="form-section">
          <label class="section-label">{{ t.productImages }}</label>
          <div class="image-uploads">

            <div class="image-upload-box">
              <input type="file" id="primary-image" accept="image/*" (change)="onPrimaryImageSelect($event)" hidden />
              <div *ngIf="primaryImagePreview" class="image-preview-container">
                <label for="primary-image" class="image-preview-label">
                  <img [src]="primaryImagePreview" alt="Primary image preview" class="image-preview" />
                </label>
                <button type="button" class="remove-image-btn" (click)="removePrimaryImage(); $event.stopPropagation()"
                  [title]="t.removeImage">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round" />
                  </svg>
                </button>
              </div>
              <label *ngIf="!primaryImagePreview" for="primary-image" class="upload-label">
                <div class="upload-icon">
                  <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" />
                    <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                  </svg>
                </div>
                <p class="upload-text">{{ t.dragOrClick }}</p>
              </label>
            </div>

            <div class="image-upload-box">
              <input type="file" id="secondary-image" accept="image/*" (change)="onSecondaryImageSelect($event)"
                hidden />
              <div *ngIf="secondaryImagePreview" class="image-preview-container">
                <label for="secondary-image" class="image-preview-label">
                  <img [src]="secondaryImagePreview" alt="Secondary image preview" class="image-preview" />
                </label>
                <button type="button" class="remove-image-btn"
                  (click)="removeSecondaryImage(); $event.stopPropagation()" [title]="t.removeImage">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round" />
                  </svg>
                </button>
              </div>
              <label *ngIf="!secondaryImagePreview" for="secondary-image" class="upload-label">
                <div class="upload-icon">
                  <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" />
                    <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                  </svg>
                </div>
                <p class="upload-text">{{ t.dragOrClick }}</p>
              </label>
            </div>

          </div>
        </div>

        <!-- ── Product Data ─────────────────────────────────────────────────── -->
        <div class="form-section product-data-section">
          <label class="section-label">{{ t.productData }}</label>

          <div class="form-field">
            <label class="field-label">{{ t.productCode }} <span class="required">*</span></label>
            <input type="text" [(ngModel)]="productData.code" name="code" placeholder="{{ t.productCodePlaceholder }}" class="form-input"
              required />
          </div>

          <div class="form-row">
            <div class="form-field">
              <label class="field-label">{{ t.productNameEn }} <span class="required">*</span></label>
              <input type="text" [(ngModel)]="productData.nameEn" name="nameEn"
                placeholder="{{ t.productNameEn }}" class="form-input" required />
            </div>
            <div class="form-field">
              <label class="field-label">{{ t.productNameAr }} <span class="required">*</span></label>
              <input type="text" [(ngModel)]="productData.nameAr" name="nameAr" placeholder="{{ t.productNameAr }}"
                class="form-input" required />
            </div>
          </div>

          <div class="form-field">
            <label class="field-label">{{ t.productDescriptionAr }} <span class="required">*</span></label>
            <textarea [(ngModel)]="productData.descriptionAr" name="descriptionAr" placeholder="{{ t.productDescriptionAr }}"
              class="form-textarea" required></textarea>
          </div>

          <div class="form-field">
            <label class="field-label">{{ t.productDescriptionEn }} <span class="required">*</span></label>
            <textarea [(ngModel)]="productData.descriptionEn" name="descriptionEn"
              placeholder="{{ t.productDescriptionEn }}" class="form-textarea" required></textarea>
          </div>

          <div class="form-field">
            <label class="field-label">{{ t.allergensAr }} <span class="required">*</span></label>
            <input type="text" [(ngModel)]="productData.allergens" name="allergens" placeholder="{{ t.allergensAr }}"
              class="form-input" required />
          </div>

          <div class="form-field">
            <label class="field-label">{{ t.allergensEn }} <span class="required">*</span></label>
            <input type="text" [(ngModel)]="productData.allergensEn" name="allergensEn"
              placeholder="{{ t.allergensEn }}" class="form-input" required />
          </div>

          <div class="form-row">
            <div class="form-field">
              <label class="field-label">{{ t.price }} <span class="required">*</span></label>
              <input type="number" [(ngModel)]="productData.price" name="price" placeholder="{{ t.price }}" class="form-input"
                step="0.01" min="0.01" required />
            </div>
            <div class="form-field">
              <label class="field-label">{{ t.weightInKg }} <span class="required">*</span></label>
              <input type="number" [(ngModel)]="productData.weightInKg" name="weightInKg"
                placeholder="{{ t.weightInKg }}" class="form-input" step="0.01" min="0.01" required />
            </div>
          </div>
        </div>

        <!-- ── Branches ────────────────────────────────────────────────────── -->
        <div class="form-section">
          <label class="section-label">{{ t.branchesAndQuantities }}</label>

          <div *ngIf="isLoadingBranches" class="loading-branches">
            <p>{{ t.loadingBranches }}</p>
          </div>

          <div *ngIf="!isLoadingBranches && branches.length === 0" class="no-branches">
            <p>{{ t.noBranches }}</p>
          </div>

          <div *ngIf="!isLoadingBranches && branches.length > 0" class="branches-list">
            <div *ngFor="let branch of branches" class="branch-item">

              <!-- Checkbox row -->
              <div class="branch-checkbox">
                <input type="checkbox" [id]="'branch-' + branch.id" [checked]="isBranchSelected(branch.id)"
                  (change)="onBranchToggle(branch, $event)" class="checkbox-input" />
                <label [for]="'branch-' + branch.id" class="checkbox-label">
                  {{ branch.name || branch.nameAr || branch.nameEn }}
                </label>
              </div>

              <!-- Expanded fields when selected -->
              <div *ngIf="isBranchSelected(branch.id)" class="branch-fields">

                <!-- Row 1 -->
                <div class="form-row">

                  <div class="form-field">
                    <label class="field-label">{{ t.quantity }}</label>
                    <input type="number" [value]="getBranch(branch.id)?.quantity ?? 0"
                      (input)="updateBranchField(branch.id!, 'quantity', +$any($event.target).value)" min="0"
                      placeholder="0" class="form-input" />
                  </div>

                  <div class="form-field">
                    <label class="field-label">{{ t.discountPercentage }}</label>
                    <input type="number" [value]="getBranch(branch.id)?.discount ?? 0"
                      (input)="updateBranchField(branch.id!, 'discount', +$any($event.target).value)" min="0" max="100"
                      placeholder="0" class="form-input" />
                  </div>

                </div>

                <!-- Row 2 -->
                <div class="form-row">

                  <div class="form-field">
                    <label class="field-label">{{ t.expiryDate }}</label>
                    <input type="date" [value]="getBranch(branch.id)?.expiryDate ?? ''"
                      (change)="updateBranchField(branch.id!, 'expiryDate', $any($event.target).value)"
                      class="form-input" />
                  </div>

                  <div class="form-field">
                    <label class="field-label">{{ t.startDelivery }}</label>
                    <input type="datetime-local" [value]="getBranch(branch.id)?.startDeliveryDate ?? ''"
                      (change)="updateBranchField(branch.id!, 'startDeliveryDate', $any($event.target).value)"
                      class="form-input" />
                  </div>

                </div>

                <!-- Row 3 -->
                <div class="form-row">

                  <div class="form-field">
                    <label class="field-label">{{ t.endDelivery }}</label>
                    <input type="datetime-local" [value]="getBranch(branch.id)?.endDeliveryDate ?? ''"
                      (change)="updateBranchField(branch.id!, 'endDeliveryDate', $any($event.target).value)"
                      class="form-input" />
                  </div>

                  <div class="form-field empty-field"></div>

                </div>

              </div>
            </div>
          </div>
        </div>

        <div *ngIf="errorMessage" class="form-error-message">{{ errorMessage }}</div>

        <button type="submit" class="submit-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">
            <span class="btn-icon">+</span>
            <span>{{ t.submitAdd }}</span>
          </span>
          <span *ngIf="isLoading">{{ t.submitting }}</span>
        </button>
      </form>
    </div>
  </div>
</div>
